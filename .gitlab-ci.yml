stages:
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Reusable anchor — expands into before_script lists inline
.setup-rsa-keys: &setup-rsa-keys
  - mkdir -p backend/src/main/resources/certs
  - echo "$RSA_PRIVATE_KEY" > backend/src/main/resources/certs/private.pem
  - echo "$RSA_PUBLIC_KEY" > backend/src/main/resources/certs/public.pem
  - chmod 600 backend/src/main/resources/certs/private.pem
  - chmod 644 backend/src/main/resources/certs/public.pem

# ── Backend unit tests ────────────────────────────────────────────────────────
# Requires runners tagged 'linux', 'macos', and 'windows'.
# The image directive is used by Docker executor (Linux); macOS/Windows runners
# use a shell executor and must have Java 21 + Maven pre-installed.
unit-test-backend:
  stage: test
  image: maven:3.9-amazoncorretto-21
  parallel:
    matrix:
      - PLATFORM: [linux, macos, windows]
  tags:
    - $PLATFORM
  cache:
    key: maven-$CI_COMMIT_REF_SLUG-$PLATFORM
    paths:
      - .m2/repository
  before_script:
    - *setup-rsa-keys
  script:
    - mvn -f backend/pom.xml clean test

# ── Frontend unit tests ───────────────────────────────────────────────────────
# macOS/Windows shell executor runners must have Node 22 pre-installed.
unit-test-frontend:
  stage: test
  image: node:22
  parallel:
    matrix:
      - PLATFORM: [linux, macos, windows]
  tags:
    - $PLATFORM
  before_script:
    - *setup-rsa-keys
    - npm install -g yarn
    - yarn --cwd frontend install --frozen-lockfile
  script:
    - cd frontend && npm run test:unit

# ── E2E tests ─────────────────────────────────────────────────────────────────
# Linux Docker runner: uses maven:3.9-eclipse-temurin-21 as base; Node 22 is
# installed via NodeSource in before_script.
# macOS shell executor runners must have Node 22, Java 21, Maven, and
# Playwright browser dependencies pre-installed.
e2e-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  parallel:
    matrix:
      - PLATFORM: [linux, macos]
  tags:
    - $PLATFORM
  cache:
    key: maven-$CI_COMMIT_REF_SLUG-$PLATFORM
    paths:
      - .m2/repository
  before_script:
    - |
      if command -v apt-get > /dev/null; then
        apt-get update -qq
        apt-get install -y -qq curl
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y -qq nodejs
      fi
    - npm install -g yarn
    - *setup-rsa-keys
    - yarn --cwd frontend install --frozen-lockfile
  script:
    - mvn -f backend/pom.xml clean install -q
    - JAR_PATH=$(find backend/target -name 'hasev2-*.jar' | head -1)
    - java -jar "$JAR_PATH" &
    - |
      echo "Waiting for backend to start..."
      max_retries=12
      retry_count=0
      until curl -sf http://127.0.0.1:8080/health; do
        retry_count=$((retry_count + 1))
        if [ "$retry_count" -ge "$max_retries" ]; then
          echo "Backend did not start within the expected time."
          exit 1
        fi
        echo "Waiting for backend to start (retry $retry_count)"
        sleep 5
      done
    - cd frontend && yarn playwright install --with-deps
    - npm run build
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - frontend/test-results
    expire_in: 30 days
